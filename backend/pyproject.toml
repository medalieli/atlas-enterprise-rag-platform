[project]
name = "production-rag-assistant-backend"
version = "0.1.0"
description = "FastAPI backend for the Production RAG Assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16.5,<2",
    "asyncpg>=0.30.0,<0.31",
    "celery[redis]>=5.5.3,<5.6",
    "fastapi>=0.116.1,<0.117",
    "pgvector>=0.4.1,<0.5",
    "pydantic-settings>=2.10.1,<3",
    "python-multipart>=0.0.20,<0.1",
    "python-docx>=1.2.0,<2",
    "pypdf>=6.0.0,<7",
    "sqlalchemy[asyncio]>=2.0.43,<3",
    "uvicorn[standard]>=0.35.0,<0.36",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1,<0.29",
    "pytest>=8.4.1,<9",
    "pytest-asyncio>=1.1.0,<2",
    "ruff>=0.12.9,<0.13",
]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
markers = ["integration: requires the Compose PostgreSQL service"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
