name: production-rag-assistant

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_assistant_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rag_assistant_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_assistant_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Production RAG Assistant}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_assistant_dev:rag_assistant_dev@postgres:5432/rag_assistant_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rag_assistant_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rag_assistant_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_assistant_dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_DOCX_UNCOMPRESSED_BYTES: ${MAX_DOCX_UNCOMPRESSED_BYTES:-104857600}
      DEVELOPMENT_TENANT_ID: ${DEVELOPMENT_TENANT_ID:-}
      DEVELOPMENT_USER_ID: ${DEVELOPMENT_USER_ID:-}
      PARSER_MAX_PDF_PAGES: ${PARSER_MAX_PDF_PAGES:-500}
      PARSER_MAX_EXTRACTED_CHARS: ${PARSER_MAX_EXTRACTED_CHARS:-5000000}
      PARSER_MAX_PDF_STREAM_BYTES: ${PARSER_MAX_PDF_STREAM_BYTES:-52428800}
      CHUNK_TARGET_CHARS: ${CHUNK_TARGET_CHARS:-1200}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1800}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-150}
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_storage:/data/documents
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine3.22
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["uv", "run", "--no-sync", "celery", "-A", "app.worker:celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_assistant_dev:rag_assistant_dev@postgres:5432/rag_assistant_dev}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /data/documents
      CELERY_MAX_RETRIES: ${CELERY_MAX_RETRIES:-3}
      PARSER_MAX_PDF_PAGES: ${PARSER_MAX_PDF_PAGES:-500}
      PARSER_MAX_EXTRACTED_CHARS: ${PARSER_MAX_EXTRACTED_CHARS:-5000000}
      PARSER_MAX_PDF_STREAM_BYTES: ${PARSER_MAX_PDF_STREAM_BYTES:-52428800}
      PARSER_SOFT_TIME_LIMIT_SECONDS: ${PARSER_SOFT_TIME_LIMIT_SECONDS:-120}
      PARSER_HARD_TIME_LIMIT_SECONDS: ${PARSER_HARD_TIME_LIMIT_SECONDS:-150}
      CHUNK_TARGET_CHARS: ${CHUNK_TARGET_CHARS:-1200}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1800}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-150}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_storage:/data/documents
    healthcheck:
      test: ["CMD-SHELL", "uv run --no-sync celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m

volumes:
  postgres_data:
  document_storage:
