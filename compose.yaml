name: production-rag-assistant

services:
  frontend:
    build:
      context: ./frontend
    environment:
      APP_ENV: ${APP_ENV:-development}
      API_INTERNAL_URL: http://api:8000
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-development-session-secret-change-me}
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:-}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid profile offline_access rag:access}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://$$HOSTNAME:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rag_assistant_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rag_assistant_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_assistant_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init/001-enable-vector.sql:/docker-entrypoint-initdb.d/001-enable-vector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  api:
    build:
      context: ./backend
      args:
        DOWNLOAD_RERANKER: ${DOWNLOAD_RERANKER:-true}
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-Production RAG Assistant}
      API_PORT: ${API_PORT:-8000}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_assistant_dev:rag_assistant_dev@postgres:5432/rag_assistant_dev}
      POSTGRES_DB: ${POSTGRES_DB:-rag_assistant_dev}
      POSTGRES_USER: ${POSTGRES_USER:-rag_assistant_dev}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rag_assistant_dev}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30}
      EMBEDDING_PROVIDER_MAX_RETRIES: ${EMBEDDING_PROVIDER_MAX_RETRIES:-0}
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID:-cross-encoder/mmarco-mMiniLMv2-L12-H384-v1}
      RERANKER_PROVIDER: ${RERANKER_PROVIDER:-local}
      RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-1427fd652930e4ba29e8149678df786c240d8825}
      RERANKER_MODEL_PATH: ${RERANKER_MODEL_PATH:-/models/reranker}
      RERANKER_CANDIDATE_LIMIT: ${RERANKER_CANDIDATE_LIMIT:-30}
      RERANKER_BATCH_SIZE: ${RERANKER_BATCH_SIZE:-8}
      RERANKER_MAX_LENGTH: ${RERANKER_MAX_LENGTH:-512}
      RERANKER_TIMEOUT_SECONDS: ${RERANKER_TIMEOUT_SECONDS:-30}
      RERANKER_MAX_CONCURRENCY: ${RERANKER_MAX_CONCURRENCY:-2}
      ANSWER_MODEL: ${ANSWER_MODEL:-gpt-5.6-terra}
      ANSWER_PROVIDER: ${ANSWER_PROVIDER:-openai}
      ANSWER_REASONING_EFFORT: ${ANSWER_REASONING_EFFORT:-low}
      ANSWER_VERBOSITY: ${ANSWER_VERBOSITY:-medium}
      ANSWER_MAX_CONTEXT_CHUNKS: ${ANSWER_MAX_CONTEXT_CHUNKS:-8}
      ANSWER_MAX_CONTEXT_TOKENS: ${ANSWER_MAX_CONTEXT_TOKENS:-12000}
      ANSWER_MAX_CONTEXT_CHARS: ${ANSWER_MAX_CONTEXT_CHARS:-48000}
      ANSWER_MAX_OUTPUT_TOKENS: ${ANSWER_MAX_OUTPUT_TOKENS:-2000}
      ANSWER_PROVIDER_TIMEOUT_SECONDS: ${ANSWER_PROVIDER_TIMEOUT_SECONDS:-45}
      ANSWER_PROVIDER_MAX_RETRIES: ${ANSWER_PROVIDER_MAX_RETRIES:-1}
      ANSWER_MAX_CONCURRENCY: ${ANSWER_MAX_CONCURRENCY:-2}
      ANSWER_MAX_CLAIMS: ${ANSWER_MAX_CLAIMS:-12}
      ANSWER_MAX_CITATIONS_PER_CLAIM: ${ANSWER_MAX_CITATIONS_PER_CLAIM:-5}
      REWRITE_MODEL: ${REWRITE_MODEL:-gpt-5.6-luna}
      REWRITE_REASONING_EFFORT: ${REWRITE_REASONING_EFFORT:-low}
      REWRITE_MAX_OUTPUT_TOKENS: ${REWRITE_MAX_OUTPUT_TOKENS:-600}
      REWRITE_PROVIDER_TIMEOUT_SECONDS: ${REWRITE_PROVIDER_TIMEOUT_SECONDS:-30}
      REWRITE_PROVIDER_MAX_RETRIES: ${REWRITE_PROVIDER_MAX_RETRIES:-1}
      REWRITE_MAX_CONCURRENCY: ${REWRITE_MAX_CONCURRENCY:-2}
      CONVERSATION_HISTORY_MAX_TURNS: ${CONVERSATION_HISTORY_MAX_TURNS:-6}
      CONVERSATION_HISTORY_MAX_MESSAGES: ${CONVERSATION_HISTORY_MAX_MESSAGES:-12}
      CONVERSATION_HISTORY_MAX_TOKENS: ${CONVERSATION_HISTORY_MAX_TOKENS:-4000}
      CONVERSATION_HISTORY_MAX_CHARS: ${CONVERSATION_HISTORY_MAX_CHARS:-16000}
      REDIS_URL: redis://redis:6379/0
      DOCUMENT_STORAGE_PATH: /data/documents
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-20971520}
      MAX_DOCX_UNCOMPRESSED_BYTES: ${MAX_DOCX_UNCOMPRESSED_BYTES:-104857600}
      DEVELOPMENT_TENANT_ID: ${DEVELOPMENT_TENANT_ID:-}
      DEVELOPMENT_USER_ID: ${DEVELOPMENT_USER_ID:-}
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      AUTH_ISSUER: ${AUTH_ISSUER:-}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-}
      AUTH_ALLOWED_ALGORITHM: ${AUTH_ALLOWED_ALGORITHM:-RS256}
      AUTH_EXPECTED_TOKEN_TYPE: ${AUTH_EXPECTED_TOKEN_TYPE:-at+jwt}
      AUTH_REQUIRED_SCOPES: ${AUTH_REQUIRED_SCOPES:-rag:access}
      AUTH_CLOCK_SKEW_SECONDS: ${AUTH_CLOCK_SKEW_SECONDS:-30}
      AUTH_MAX_TOKEN_BYTES: ${AUTH_MAX_TOKEN_BYTES:-8192}
      AUTH_MAX_TOKEN_AGE_SECONDS: ${AUTH_MAX_TOKEN_AGE_SECONDS:-3600}
      AUTH_JWKS_TIMEOUT_SECONDS: ${AUTH_JWKS_TIMEOUT_SECONDS:-3}
      AUTH_JWKS_CACHE_SECONDS: ${AUTH_JWKS_CACHE_SECONDS:-300}
      AUTH_JWKS_MAX_BYTES: ${AUTH_JWKS_MAX_BYTES:-65536}
      AUTH_ALLOW_INSECURE_HTTP: ${AUTH_ALLOW_INSECURE_HTTP:-false}
      PARSER_MAX_PDF_PAGES: ${PARSER_MAX_PDF_PAGES:-500}
      PARSER_MAX_EXTRACTED_CHARS: ${PARSER_MAX_EXTRACTED_CHARS:-5000000}
      PARSER_MAX_PDF_STREAM_BYTES: ${PARSER_MAX_PDF_STREAM_BYTES:-52428800}
      CHUNK_TARGET_CHARS: ${CHUNK_TARGET_CHARS:-1200}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1800}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-150}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      SERVICE_NAME: rag-api
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_storage:/data/documents
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live', timeout=2)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  redis:
    image: redis:8.2.1-alpine3.22
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      args:
        DOWNLOAD_RERANKER: ${DOWNLOAD_RERANKER:-true}
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=WARNING", "--concurrency=2"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://rag_assistant_dev:rag_assistant_dev@postgres:5432/rag_assistant_dev}
      REDIS_URL: redis://redis:6379/0
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-openai}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-1536}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-64}
      EMBEDDING_REQUEST_TIMEOUT_SECONDS: ${EMBEDDING_REQUEST_TIMEOUT_SECONDS:-30}
      EMBEDDING_PROVIDER_MAX_RETRIES: ${EMBEDDING_PROVIDER_MAX_RETRIES:-0}
      DOCUMENT_STORAGE_PATH: /data/documents
      CELERY_MAX_RETRIES: ${CELERY_MAX_RETRIES:-3}
      PARSER_MAX_PDF_PAGES: ${PARSER_MAX_PDF_PAGES:-500}
      PARSER_MAX_EXTRACTED_CHARS: ${PARSER_MAX_EXTRACTED_CHARS:-5000000}
      PARSER_MAX_PDF_STREAM_BYTES: ${PARSER_MAX_PDF_STREAM_BYTES:-52428800}
      PARSER_SOFT_TIME_LIMIT_SECONDS: ${PARSER_SOFT_TIME_LIMIT_SECONDS:-120}
      PARSER_HARD_TIME_LIMIT_SECONDS: ${PARSER_HARD_TIME_LIMIT_SECONDS:-150}
      CHUNK_TARGET_CHARS: ${CHUNK_TARGET_CHARS:-1200}
      CHUNK_MAX_CHARS: ${CHUNK_MAX_CHARS:-1800}
      CHUNK_OVERLAP_CHARS: ${CHUNK_OVERLAP_CHARS:-150}
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED:-false}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      SERVICE_NAME: rag-worker
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - document_storage:/data/documents
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    mem_limit: 512m

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.136.0
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/otelcol-contrib", "components"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=24h"]
    volumes:
      - ./infrastructure/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.8.2
    profiles: ["observability"]
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./infrastructure/observability/tempo.yaml:/etc/tempo.yaml:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3200/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    profiles: ["observability"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    volumes:
      - ./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  document_storage:
