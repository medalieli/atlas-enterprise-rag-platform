name: production-rag-assistant-prod

x-hardened: &hardened
  read_only: true
  init: true
  restart: unless-stopped
  stop_grace_period: 30s
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 256
  ulimits:
    nofile: {soft: 4096, hard: 4096}
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}

services:
  proxy:
    <<: *hardened
    user: "101:101"
    image: ${NGINX_IMAGE:?Set NGINX_IMAGE to a version-and-digest reference}
    environment:
      PRODUCTION_HOSTNAME: ${PRODUCTION_HOSTNAME:?Set the public hostname without a scheme}
    command:
      - /bin/sh
      - -c
      - "envsubst '$$PRODUCTION_HOSTNAME' < /etc/nginx/nginx.conf.template > /tmp/nginx.conf && exec nginx -c /tmp/nginx.conf -g 'daemon off;'"
    ports: ["80:8080", "443:8443"]
    volumes:
      - ./infrastructure/proxy:/etc/nginx:ro
      - ${TLS_CERT_FILE:?Set TLS_CERT_FILE}:/run/tls/tls.crt:ro
      - ${TLS_KEY_FILE:?Set TLS_KEY_FILE}:/run/tls/tls.key:ro
    tmpfs: ["/var/cache/nginx:rw,noexec,nosuid,size=16m", "/var/run:rw,noexec,nosuid,size=1m", "/tmp:rw,noexec,nosuid,size=8m"]
    depends_on:
      frontend: {condition: service_healthy}
    networks: [edge, app]
    mem_limit: 128m
    cpus: 0.50

  frontend:
    <<: *hardened
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE to an immutable tag or digest}
    build:
      args:
        NODE_IMAGE: ${NODE_IMAGE:?Set NODE_IMAGE to a version-and-digest reference}
        VCS_REF: ${RELEASE_REVISION:?Set RELEASE_REVISION}
        BUILD_DATE: ${BUILD_DATE:?Set BUILD_DATE}
    ports: !reset []
    environment:
      APP_ENV: production
      NODE_ENV: production
      APP_BASE_URL: ${APP_BASE_URL:?Set the public HTTPS origin}
      SESSION_SECRET: !reset null
      SESSION_SECRET_FILE: /run/secrets/session_secret
      OIDC_AUTHORIZATION_URL: ${OIDC_AUTHORIZATION_URL:?Set OIDC authorization URL}
      OIDC_TOKEN_URL: ${OIDC_TOKEN_URL:?Set OIDC token URL}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?Set OIDC client ID}
      OIDC_CLIENT_SECRET: !reset null
      OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      DEMO_ROLE_PREVIEW_ENABLED: "false"
    secrets: [session_secret, oidc_client_secret]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=32m", "/app/.next/cache:rw,noexec,nosuid,size=32m"]
    # No ports are published, but the BFF needs outbound access to the OIDC
    # token endpoint. The proxy remains the only inbound public service.
    networks: [edge, app]
    mem_limit: 512m
    cpus: 1.0

  api:
    <<: *hardened
    image: ${API_IMAGE:?Set API_IMAGE to an immutable tag or digest}
    build:
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?Set PYTHON_IMAGE to a version-and-digest reference}
        UV_IMAGE: ${UV_IMAGE:?Set UV_IMAGE to a version-and-digest reference}
        VCS_REF: ${RELEASE_REVISION:?Set RELEASE_REVISION}
        BUILD_DATE: ${BUILD_DATE:?Set BUILD_DATE}
    ports: !reset []
    environment:
      APP_ENV: production
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      OPENAI_API_KEY: !reset null
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      AUTH_ENABLED: "true"
      DEMO_ROLE_PREVIEW_ENABLED: "false"
      DEVELOPMENT_TENANT_ID: !reset null
      DEVELOPMENT_USER_ID: !reset null
      METRICS_BEARER_TOKEN: !reset null
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
    secrets: [database_url, postgres_password, openai_api_key, metrics_bearer_token]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=128m"]
    # API egress is required for OIDC JWKS and the configured model provider.
    networks: [edge, app, data, telemetry]
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      start_period: 90s
      retries: 12

  worker:
    <<: *hardened
    image: ${API_IMAGE:?Set API_IMAGE to an immutable tag or digest}
    environment:
      APP_ENV: production
      DATABASE_URL: !reset null
      DATABASE_URL_FILE: /run/secrets/database_url
      OPENAI_API_KEY: !reset null
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      AUTH_ENABLED: "true"
      AUTH_ISSUER: ${AUTH_ISSUER:?Set production OIDC issuer}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:?Set production OIDC audience}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:?Set production OIDC JWKS URL}
      METRICS_BEARER_TOKEN: !reset null
      METRICS_BEARER_TOKEN_FILE: /run/secrets/metrics_bearer_token
      DEVELOPMENT_TENANT_ID: !reset null
      DEVELOPMENT_USER_ID: !reset null
    secrets: [database_url, openai_api_key, metrics_bearer_token]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=256m"]
    # Workers require provider egress; they still publish no host ports.
    networks: [edge, data, telemetry]
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 384
    stop_grace_period: 3m
    command: ["celery", "-A", "app.worker:celery_app", "worker", "--loglevel=WARNING", "--concurrency=2"]
    healthcheck:
      # Docker health checks are separate execs and therefore do not inherit
      # secrets exported by the PID 1 entrypoint.  Re-enter through the same
      # secret-loading wrapper before importing the Celery application.
      test: ["CMD-SHELL", "docker-entrypoint celery -A app.worker:celery_app inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

  postgres:
    image: ${POSTGRES_IMAGE:?Set POSTGRES_IMAGE to a version-and-digest reference}
    ports: !reset []
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    networks: [data]
    restart: unless-stopped
    stop_grace_period: 1m
    logging: {driver: json-file, options: {max-size: 10m, max-file: "3"}}
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256

  redis:
    <<: *hardened
    image: ${REDIS_IMAGE:?Set REDIS_IMAGE to a version-and-digest reference}
    networks: [data]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=8m"]
    mem_limit: 256m
    cpus: 0.5
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "192mb", "--maxmemory-policy", "allkeys-lru"]

  otel-collector:
    <<: *hardened
    image: ${OTEL_IMAGE:?Set OTEL_IMAGE to a version-and-digest reference}
    networks: [telemetry]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    mem_limit: 256m
  prometheus:
    <<: *hardened
    image: ${PROMETHEUS_IMAGE:?Set PROMETHEUS_IMAGE to a version-and-digest reference}
    networks: [telemetry]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m"]
    mem_limit: 512m
  tempo:
    <<: *hardened
    image: ${TEMPO_IMAGE:?Set TEMPO_IMAGE to a version-and-digest reference}
    networks: [telemetry]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m", "/var/tempo:rw,noexec,nosuid,size=256m"]
    mem_limit: 512m
  grafana:
    <<: *hardened
    image: ${GRAFANA_IMAGE:?Set GRAFANA_IMAGE to a version-and-digest reference}
    ports: !reset []
    networks: [telemetry]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
    secrets: [grafana_admin_password]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m", "/var/lib/grafana:rw,noexec,nosuid,size=128m"]
    mem_limit: 512m

networks:
  edge: {}
  app: {internal: true}
  data: {internal: true}
  telemetry: {internal: true}

secrets:
  openai_api_key:
    file: "${OPENAI_API_KEY_FILE:?Set OPENAI_API_KEY_FILE}"
  database_url:
    file: "${DATABASE_URL_FILE:?Set DATABASE_URL_FILE}"
  postgres_password:
    file: "${POSTGRES_PASSWORD_FILE:?Set POSTGRES_PASSWORD_FILE}"
  session_secret:
    file: "${SESSION_SECRET_FILE:?Set SESSION_SECRET_FILE}"
  oidc_client_secret:
    file: "${OIDC_CLIENT_SECRET_FILE:?Set OIDC_CLIENT_SECRET_FILE}"
  metrics_bearer_token:
    file: "${METRICS_BEARER_TOKEN_FILE:?Set METRICS_BEARER_TOKEN_FILE}"
  grafana_admin_password:
    file: "${GRAFANA_ADMIN_PASSWORD_FILE:?Set GRAFANA_ADMIN_PASSWORD_FILE}"
